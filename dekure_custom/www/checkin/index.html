{% extends "templates/web.html" %}
{% block page_content %}
<div style="max-width:420px;margin:40px auto;text-align:center;">
  <h3>Employee Check-in</h3>
  <div style="position:relative; display:inline-block;">
    <video id="cam" autoplay playsinline width="320" height="240" style="background:#000;border-radius:8px;"></video>
    <div id="camera-overlay"
      style="position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;pointer-events:none;">
      Point your face at the camera</div>
  </div>
  <canvas id="snap" width="320" height="240" style="display:none;"></canvas>
  <br><br>
  <button class="btn btn-secondary" id="btn-capture">Capture Selfie</button>
  <div id="preview" style="margin:10px auto;max-width:320px;display:none;">
    <img id="preview-img" src="" alt="Selfie preview" style="width:100%;border-radius:8px;border:1px solid #ddd;" />
  </div>
  <div id="location-info"
    style="margin:10px auto;max-width:320px;display:none;padding:10px;background:#f5f5f5;border-radius:8px;font-size:14px;text-align:left;">
    <div><strong>Latitude:</strong> <span id="lat-value">-</span></div>
    <div><strong>Longitude:</strong> <span id="lng-value">-</span></div>
    <div><strong>Address:</strong> <span id="address-value">Loading...</span></div>
  </div>
  <button class="btn btn-primary" id="btn-in" disabled>Check In</button>
  <button class="btn btn-default" id="btn-out" disabled>Check Out</button>
  <div id="missed-punch" style="margin-top:18px;display:none;">
    <p id="missed-punch-message" style="margin-bottom:8px;color:#666;"></p>
    <button class="btn btn-warning btn-sm" id="btn-missed-in" style="display:none;">Request Missed Check-in</button>
    <button class="btn btn-warning btn-sm" id="btn-missed-out" style="display:none;">Request Missed Check-out</button>
  </div>
  <p id="status" style="margin-top:10px;color:#666;"></p>
  <div id="camera-hint" style="margin-top:6px;color:#b00;font-size:13px;"></div>
</div>
<script>
  const video = document.getElementById('cam');
  const canvas = document.getElementById('snap');
  const statusEl = document.getElementById('status');
  const cameraHint = document.getElementById('camera-hint');
  const captureBtn = document.getElementById('btn-capture');
  const checkInBtn = document.getElementById('btn-in');
  const checkOutBtn = document.getElementById('btn-out');
  const missedPunch = document.getElementById('missed-punch');
  const missedPunchMessage = document.getElementById('missed-punch-message');
  const missedCheckinBtn = document.getElementById('btn-missed-in');
  const missedCheckoutBtn = document.getElementById('btn-missed-out');
  let missedCheckoutDate = null;
  const preview = document.getElementById('preview');
  const previewImg = document.getElementById('preview-img');
  const locationInfo = document.getElementById('location-info');
  let currentPhoto = null;
  let currentLocation = null;

  async function checkCameraPermission() {
    cameraHint.innerText = '';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      cameraHint.innerText = 'Camera API not supported in this browser.';
      captureBtn.disabled = true;
      setButtonsEnabled(false);
      return;
    }

    if (navigator.permissions && navigator.permissions.query) {
      try {
        const p = await navigator.permissions.query({ name: 'camera' });
        if (p.state === 'granted') {
          cameraHint.innerText = 'Camera permission granted.';
        } else if (p.state === 'prompt') {
          cameraHint.innerText = 'Camera permission will be requested when you capture a selfie.';
        } else if (p.state === 'denied') {
          cameraHint.innerHTML = 'Camera permission is denied for this site. Click the lock icon in the address bar → Site settings → Allow Camera.';
          captureBtn.disabled = true;
          setButtonsEnabled(false);
        }
        p.onchange = () => checkCameraPermission();
      } catch (e) {
        // permissions API may not support 'camera' on all browsers
      }
    }
  }

  async function startCamera() {
    if (video.srcObject) return true;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      statusEl.innerText = 'Camera API not supported in this browser.';
      captureBtn.disabled = true;
      return false;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
      video.srcObject = stream;
      statusEl.innerText = 'Camera is ready. Capture a selfie to enable check in/out.';
      return true;
    } catch (err) {
      statusEl.innerText = 'Camera not available: ' + err.message;
      cameraHint.innerHTML = 'Camera access blocked. Click lock icon → Site settings → Allow Camera.';
      captureBtn.disabled = true;
      setButtonsEnabled(false);
      return false;
    }
  }

  function setButtonsEnabled(enabled) {
    checkInBtn.disabled = !enabled;
    checkOutBtn.disabled = !enabled;
  }

  navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
    .then(stream => {
      video.srcObject = stream;
      statusEl.innerText = "Camera is ready. Capture a selfie to enable check in/out.";
    })
    .catch(err => {
      statusEl.innerText = "Camera not available: " + err.message;
      captureBtn.disabled = true;
      setButtonsEnabled(false);
    });

  function takePhoto() {
    const context = canvas.getContext('2d');
    context.drawImage(video, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', 0.8);
  }

  function updatePreview(photo) {
    previewImg.src = photo;
    preview.style.display = 'block';
  }

  function getAddress(lat, lng) {
    return fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
      .then(response => response.json())
      .then(data => {
        const address = data.address || {};
        return (address.road || address.street || '') +
          ', ' + (address.city || address.town || address.village || '') +
          ', ' + (address.state || '') +
          ' ' + (address.postcode || '');
      })
      .catch(err => {
        console.warn("Could not fetch address:", err);
        return "Address not available";
      });
  }

  function getLocation() {
    return new Promise(resolve => {
      if (!navigator.geolocation) return resolve(null);
      navigator.geolocation.getCurrentPosition(
        pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
        err => { console.warn("Location denied/unavailable:", err.message); resolve(null); },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    });
  }

  function getCurrentLocationForSubmission(onSuccess, onError) {
    if (!navigator.geolocation) {
      onError();
      return;
    }
    navigator.geolocation.getCurrentPosition(
      position => {
        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;
        if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) {
          onError();
          return;
        }
        onSuccess({ latitude, longitude });
      },
      err => {
        console.warn("Location denied/unavailable:", err.message);
        onError();
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  }

  function showLocationError() {
    const message = 'Unable to fetch your location. Please allow location access and try again.';
    statusEl.innerText = message;
    frappe.msgprint(__(message));
  }

  captureBtn.addEventListener('click', async () => {
    statusEl.innerText = "Capturing selfie and location...";
    const ok = await startCamera();
    if (!ok) return;

    currentPhoto = takePhoto();
    updatePreview(currentPhoto);

    currentLocation = await getLocation();

    if (currentLocation) {
      document.getElementById('lat-value').innerText = currentLocation.lat.toFixed(6);
      document.getElementById('lng-value').innerText = currentLocation.lng.toFixed(6);
      locationInfo.style.display = 'block';

      const address = await getAddress(currentLocation.lat, currentLocation.lng);
      document.getElementById('address-value').innerText = address;
    } else {
      locationInfo.style.display = 'none';
      statusEl.innerText = "⚠️ Location not available. Please enable location access.";
    }

    setButtonsEnabled(true);
    statusEl.innerText = "✅ Selfie captured with location. You can now check in or check out.";
  });

  async function sendCheckin(type) {
    if (!currentPhoto) {
      statusEl.innerText = "Please capture a selfie before checking in or out.";
      return;
    }

    statusEl.innerText = "Saving checkin...";

    frappe.call({
      method: "dekure_custom.api.create_checkin",
      args: {
        log_type: type,
        selfie: currentPhoto,
        latitude: currentLocation ? currentLocation.lat : null,
        longitude: currentLocation ? currentLocation.lng : null
      },
      callback: function (r) {
        if (r.message && r.message.ok) {
          statusEl.innerText = "✅ " + type + " saved";
          currentPhoto = null;
          currentLocation = null;
          preview.style.display = 'none';
          locationInfo.style.display = 'none';
          setButtonsEnabled(false);
          loadMissedPunchStatus();
        } else {
          statusEl.innerText = "❌ " + (r.message ? r.message.error : 'Error saving checkin');
        }
      },
      error: function (err) {
        statusEl.innerText = "❌ Failed to save checkin: " + (err.message || 'unknown error');
      }
    });
  }

  checkInBtn.addEventListener('click', () => sendCheckin('IN'));
  checkOutBtn.addEventListener('click', () => sendCheckin('OUT'));

  function loadMissedPunchStatus() {
    frappe.call({
      method: 'dekure_custom.api.get_missed_punch_status',
      callback: ({ message }) => {
        if (!message) return;
        missedPunch.style.display = 'block';
        missedCheckoutDate = message.missed_checkout_date;
        missedCheckinBtn.style.display = message.can_request_checkin ? 'inline-block' : 'none';
        missedCheckoutBtn.style.display = message.can_request_checkout ? 'inline-block' : 'none';
        if (message.blocked_by_checkout_date) {
          missedPunchMessage.innerText = `A check-out from ${message.blocked_by_checkout_date} is unresolved. Request a missed check-out before checking in today.`;
        } else if (!message.can_request_checkin && !message.can_request_checkout) {
          missedPunchMessage.innerText = 'No missed-punch request is currently needed.';
        } else {
          missedPunchMessage.innerText = 'Need to correct a missed punch? Submit it for Attendance Approver review.';
        }
      }
    });
  }

  function submitMissedPunchRequest(requestType, values, location = null) {
    frappe.call({
      method: 'dekure_custom.api.create_missed_punch_request',
      args: {
        request_type: requestType,
        ...values,
        latitude: location ? location.latitude : null,
        longitude: location ? location.longitude : null
      },
      freeze: true,
      callback: ({ message }) => {
        if (message?.ok) {
          frappe.show_alert({ message: `${requestType} request submitted for approval.`, indicator: 'green' });
          loadMissedPunchStatus();
        }
      }
    });
  }

  function requestMissedPunch(requestType, attendanceDate = null) {
    frappe.prompt([
      { fieldname: 'attendance_date', fieldtype: 'Date', label: 'Attendance Date', default: attendanceDate || frappe.datetime.get_today(), reqd: 1 },
      { fieldname: 'requested_time', fieldtype: 'Time', label: requestType === 'Missed Check-in' ? 'Requested Check-in Time' : 'Requested Check-out Time', reqd: 1 },
      { fieldname: 'reason', fieldtype: 'Small Text', label: 'Reason', reqd: 1 }
    ], values => {
      if (requestType !== 'Missed Check-out') {
        submitMissedPunchRequest(requestType, values);
        return;
      }

      statusEl.innerText = 'Fetching your current location...';
      getCurrentLocationForSubmission(
        location => submitMissedPunchRequest(requestType, values, location),
        showLocationError
      );
    }, requestType, 'Submit');
  }

  missedCheckinBtn.addEventListener('click', () => requestMissedPunch('Missed Check-in'));
  missedCheckoutBtn.addEventListener('click', () => requestMissedPunch('Missed Check-out', missedCheckoutDate));
  // perform an initial permission check to give the user actionable feedback
  checkCameraPermission();
  loadMissedPunchStatus();
</script>
{% endblock %}
